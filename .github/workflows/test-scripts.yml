name: "Script Tests"

on:
    push:
        branches-ignore:
            - "gh-pages"
    pull_request:
    workflow_dispatch:

jobs:
    test-scripts:
        name: "Test Scripts"
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  submodules: recursive

            - name: Install Bats
              run: npm install --global bats@latest

            - name: Run unit tests
              run: bats --verbose-run --show-output-of-passing-tests --timing .github/scripts/tests/unit

            - name: Run integration tests
              run: bats --verbose-run --show-output-of-passing-tests --timing .github/scripts/tests/integration
