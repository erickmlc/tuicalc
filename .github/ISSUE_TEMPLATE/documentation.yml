name: Documentation
description: Report documentation issues or request updates
title: "[Docs]: "
labels: ["documentation"]
body:
    - type: input
      id: location
      attributes:
          label: Location
          description: URL or file path of the documentation.
      validations:
          required: true
    - type: textarea
      id: problem
      attributes:
          label: Issue Description
          description: Describe what is incorrect, missing, or unclear.
      validations:
          required: true
    - type: textarea
      id: suggestion
      attributes:
          label: Proposed Fix
